<script>
(() => {
  "use strict";

  const SAVE_KEY = "yuragi.aquarium.v1";
  const CAPACITY = 16;
  const DECOR_CAP = 10;
  const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ------------------------------------------------------------------ *
   * catalogue
   * ------------------------------------------------------------------ */

  const SPECIES = {
    medaka: {
      kind: "fish", name: "メダカ", price: 20, rate: 0.6, size: 20, ratio: 0.44,
      c1: "#c9832f", c2: "#ffe6b4", fin: "#ffd58a", tail: "fork", mark: "none",
      note: "小さくて丈夫。はじめの一匹に。"
    },
    neon: {
      kind: "fish", name: "ネオンテトラ", price: 30, rate: 0.9, size: 24, ratio: 0.42,
      c1: "#1d5d80", c2: "#a9e6fb", fin: "#bfe9f7", tail: "fork", mark: "neon",
      note: "青い光の帯。群れると映える。"
    },
    guppy: {
      kind: "fish", name: "グッピー", price: 45, rate: 1.2, size: 23, ratio: 0.44,
      c1: "#d9622a", c2: "#ffd58f", fin: "#ff9f5f", tail: "veil", mark: "spots",
      note: "ひらひらの尾びれが自慢。"
    },
    cory: {
      kind: "fish", name: "コリドラス", price: 80, rate: 1.7, size: 27, ratio: 0.5,
      c1: "#7d7259", c2: "#e8dcc0", fin: "#d6c9a6", tail: "fork", mark: "spots",
      bottom: true, clean: 0.15,
      note: "砂の上をつつく底ぐらし。少し掃除もする。"
    },
    eel: {
      kind: "eel", name: "チンアナゴ", price: 95, rate: 1.9, size: 56,
      c1: "#cfc6b2", c2: "#fbf8f0",
      note: "砂から生えてゆらゆら。おどろくと引っこむ。"
    },
    goldfish: {
      kind: "fish", name: "金魚", price: 130, rate: 2.3, size: 33, ratio: 0.66,
      c1: "#e3521f", c2: "#ffcf7a", fin: "#ff9b57", tail: "veil", mark: "none",
      note: "ゆったり泳ぐ定番。"
    },
    betta: {
      kind: "fish", name: "ベタ", price: 190, rate: 3.1, size: 28, ratio: 0.62,
      c1: "#33269c", c2: "#8f6bff", fin: "#ff5c9e", tail: "flow", mark: "none",
      note: "布のようなひれ。ひとりが好き。"
    },
    angel: {
      kind: "fish", name: "エンゼルフィッシュ", price: 280, rate: 4.2, size: 30, ratio: 0.9,
      c1: "#a49b88", c2: "#fdfaf0", fin: "#efe6d0", tail: "flow", mark: "tiger",
      tall: true,
      note: "縦に長い体。水槽の主役。"
    },
    minami: {
      kind: "shrimp", name: "ミナミヌマエビ", price: 40, rate: 0.9, size: 15,
      c1: "#8fb59a", c2: "#dff0e2", clean: 0.35,
      note: "コケを食べて水をきれいに保つ。"
    },
    redbee: {
      kind: "shrimp", name: "レッドビーシュリンプ", price: 160, rate: 2.5, size: 15,
      c1: "#c92c34", c2: "#fff4f0", clean: 0.3, banded: true,
      note: "紅白の縞。小さな宝石。"
    },
    snail: {
      kind: "snail", name: "石巻貝", price: 25, rate: 0.3, size: 13,
      c1: "#3d3126", c2: "#c7a878", clean: 0.6,
      note: "ガラスのコケ取り担当。とにかく地道。"
    }
  };

  const DECOR = {
    plant:     { name: "水草",     price: 20,  size: 62, note: "ゆらゆら。魚のかくれ家に。" },
    shell:     { name: "貝がら",   price: 15,  size: 26, note: "砂の上のささやかな一点。" },
    rock:      { name: "岩",       price: 35,  size: 44, note: "レイアウトの土台になる。" },
    marimo:    { name: "マリモ",   price: 55,  size: 30, note: "まるい。ただただ、まるい。" },
    driftwood: { name: "流木",     price: 60,  size: 78, note: "水槽が一気に自然っぽくなる。" },
    coral:     { name: "サンゴ",   price: 90,  size: 58, note: "枝ぶりが華やか。" },
    airstone:  { name: "エアストーン", price: 110, size: 22, note: "泡がのぼる。水がすこし澄む。", clean: 0.4 },
    castle:    { name: "お城",     price: 220, size: 80, note: "水槽の中の小さな城下町。" }
  };

  const NAME_POOL = ["ぷか", "あおば", "こむぎ", "しらす", "もなか", "きなこ", "つぶら",
                     "ゆらり", "まめ", "ぽん", "すい", "みずき", "あわ", "こはく",
                     "ちゃぷ", "なぎ", "しずく", "とと"];

  /* ------------------------------------------------------------------ *
   * state
   * ------------------------------------------------------------------ */

  const state = {
    name: "はじめての水槽",
    coins: 150,
    dirt: 0,
    night: false,
    seed: Math.floor(Math.random() * 1e9),
    pets: [],
    decor: [],
    food: [],
    nextId: 1,
    savedAt: Date.now()
  };

  const canvas = document.getElementById("tank");
  const ctx = canvas.getContext("2d");
  let W = 800, H = 420, dpr = 1;
  let time = 0;
  let feedMode = false;
  let feedTimer = 0;
  let selected = null;          // { type: "pet"|"decor", id }
  let cleanFlash = 0;
  const sparks = [];
  const bubbles = [];

  /* ------------------------------------------------------------------ *
   * helpers
   * ------------------------------------------------------------------ */

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function waterTop() { return H * 0.05; }
  function sandTop()  { return H * 0.80; }
  function sandBase(x) { return sandTop() + 4 + Math.sin(x * 0.006) * 3; }

  function toast(msg) {
    const box = document.getElementById("toasts");
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(() => el.remove(), 2700);
  }

  function showHint(msg, ms) {
    const el = document.getElementById("hint");
    el.textContent = msg;
    el.classList.add("is-on");
    clearTimeout(showHint.t);
    if (ms) showHint.t = setTimeout(() => el.classList.remove("is-on"), ms);
  }
  function hideHint() {
    document.getElementById("hint").classList.remove("is-on");
  }

  function freshName() {
    const used = new Set(state.pets.map(p => p.name));
    const free = NAME_POOL.filter(n => !used.has(n));
    return free.length ? pick(free) : pick(NAME_POOL) + Math.floor(rnd(2, 99));
  }

  /* ------------------------------------------------------------------ *
   * save / load
   * ------------------------------------------------------------------ */

  function save() {
    state.savedAt = Date.now();
    const data = {
      v: 1,
      name: state.name,
      coins: state.coins,
      dirt: state.dirt,
      night: state.night,
      seed: state.seed,
      savedAt: state.savedAt,
      nextId: state.nextId,
      pets: state.pets.map(p => ({
        id: p.id, key: p.key, name: p.name, full: p.full,
        nx: p.x / W, ny: p.y / H
      })),
      decor: state.decor.map(d => ({ id: d.id, key: d.key, nx: d.x / W, flip: d.flip, seed: d.seed, sc: d.scale }))
    };
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) { /* private mode */ }
  }

  function load() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (e) { data = null; }
    if (!data || data.v !== 1) return false;

    state.name = typeof data.name === "string" ? data.name : state.name;
    state.coins = Number(data.coins) || 0;
    state.dirt = clamp(Number(data.dirt) || 0, 0, 1);
    state.night = !!data.night;
    state.seed = Number(data.seed) || state.seed;
    state.nextId = Number(data.nextId) || 1;

    (data.pets || []).forEach(p => {
      if (!SPECIES[p.key]) return;
      state.pets.push(makePet(p.key, {
        id: p.id, name: p.name, full: clamp(Number(p.full), 0, 1),
        x: clamp(Number(p.nx) || 0.5, 0.05, 0.95) * W,
        y: clamp(Number(p.ny) || 0.5, 0.08, 0.9) * H
      }));
    });
    (data.decor || []).forEach(d => {
      if (!DECOR[d.key]) return;
      state.decor.push(makeDecor(d.key, clamp(Number(d.nx) || 0.5, 0.04, 0.96) * W, {
        id: d.id, flip: d.flip, seed: d.seed, scale: d.sc
      }));
    });

    // offline progress, capped at 12h
    const elapsed = clamp((Date.now() - (Number(data.savedAt) || Date.now())) / 1000, 0, 12 * 3600);
    if (elapsed > 20) tickEconomy(elapsed, true);
    return true;
  }

  /* ------------------------------------------------------------------ *
   * entities
   * ------------------------------------------------------------------ */

  function makePet(key, opts) {
    const s = SPECIES[key];
    const o = opts || {};
    const p = {
      id: o.id != null ? o.id : state.nextId++,
      key,
      name: o.name || freshName(),
      full: o.full != null ? o.full : 0.85,
      x: o.x != null ? o.x : rnd(W * 0.2, W * 0.8),
      y: o.y != null ? o.y : rnd(waterTop() + 30, sandTop() - 20),
      vx: rnd(-18, 18) || 12,
      vy: 0,
      phase: rnd(0, 7),
      wander: rnd(0, 7),
      steerT: rnd(0, 2),
      dartT: rnd(1, 5),
      scale: rnd(0.9, 1.12)
    };
    if (o.id != null && o.id >= state.nextId) state.nextId = o.id + 1;
    if (s.kind !== "fish" || s.bottom) p.y = sandTop() - rnd(2, 14);
    if (s.kind === "eel") {
      p.y = sandBase(p.x);
      p.vx = 0;
      p.ext = 0.15;          // how far out of the sand, 0..1
      p.lean = 0;            // head reaching sideways for food
      p.shy = 0;             // seconds left hiding after a scare
    }
    return p;
  }

  // garden eels look best spaced out, so a new one picks the emptiest patch of sand
  function freeEelX() {
    const eels = state.pets.filter(p => SPECIES[p.key].kind === "eel");
    if (!eels.length) return rnd(W * 0.15, W * 0.85);
    let bestX = W * 0.5, bestD = -1;
    for (let i = 0; i < 30; i++) {
      const x = rnd(W * 0.1, W * 0.9);
      let d = Infinity;
      for (const e of eels) d = Math.min(d, Math.abs(e.x - x));
      if (d > bestD) { bestD = d; bestX = x; }
    }
    return bestX;
  }

  function makeDecor(key, x, opts) {
    const o = opts || {};
    return {
      id: o.id != null ? o.id : state.nextId++,
      key,
      x: clamp(x, W * 0.05, W * 0.95),
      flip: o.flip != null ? o.flip : (Math.random() < 0.5 ? -1 : 1),
      seed: o.seed != null ? o.seed : Math.floor(Math.random() * 1e6),
      scale: clamp(Number(o.scale) || 1, DECOR_MIN, DECOR_MAX)
    };
  }

  // one scale for the whole tank, so a narrow phone screen does not get giant fish
  function tankScale() {
    return clamp(Math.min(W / 820, H / 460), 0.68, 1.5);
  }

  function petPx(p) {
    return SPECIES[p.key].size * p.scale * tankScale();
  }

  const DECOR_MIN = 0.5, DECOR_MAX = 2;

  function decorPx(d) {
    return DECOR[d.key].size * tankScale() * 1.05 * (d.scale || 1);
  }

  /* ------------------------------------------------------------------ *
   * economy
   * ------------------------------------------------------------------ */

  function coinRate() {                       // coins per minute
    let sum = 0;
    for (const p of state.pets) sum += SPECIES[p.key].rate;
    return sum * happiness();
  }

  function happiness() {
    if (!state.pets.length) return 0;
    let avg = 0;
    for (const p of state.pets) avg += p.full;
    avg /= state.pets.length;
    return clamp(avg * 0.72 + (1 - state.dirt) * 0.28, 0, 1);
  }

  function cleanPower() {
    let c = 0;
    for (const p of state.pets) c += SPECIES[p.key].clean || 0;
    for (const d of state.decor) c += DECOR[d.key].clean || 0;
    return c;
  }

  function tickEconomy(dt, offline) {
    const hungerRate = 1 / (5 * 3600);
    for (const p of state.pets) p.full = clamp(p.full - hungerRate * dt, 0, 1);

    const load = state.pets.length * 0.0000055 * (state.night ? 0.5 : 1);
    const scrub = cleanPower() * 0.0000042;
    state.dirt = clamp(state.dirt + (load - scrub) * dt, 0, 1);

    state.coins += coinRate() / 60 * dt;

    if (offline && state.coins > 0) {
      const got = Math.floor(coinRate() / 60 * dt);
      if (got > 3) setTimeout(() => toast("るすばん中に " + got + " コインたまった"), 500);
    }
  }

  /* ------------------------------------------------------------------ *
   * simulation
   * ------------------------------------------------------------------ */

  function nearestFood(p, reach) {
    let best = null, bd = reach * reach;
    for (const f of state.food) {
      const dx = f.x - p.x, dy = f.y - p.y;
      const d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = f; }
    }
    return best;
  }

  function updatePet(p, dt) {
    const s = SPECIES[p.key];
    const px = petPx(p);
    const top = waterTop() + px * 0.6;
    const floor = sandTop() - px * 0.18;
    const slow = state.night ? 0.45 : 1;

    if (s.kind === "snail") {
      p.steerT -= dt;
      if (p.steerT <= 0) { p.steerT = rnd(3, 8); p.vx = rnd(-4, 4) || 3; }
      p.x += p.vx * dt * slow;
      if (p.x < px * 0.6 || p.x > W - px * 0.6) { p.vx *= -1; p.x = clamp(p.x, px * 0.6, W - px * 0.6); }
      p.y = sandTop() - px * 0.18;
      p.phase += dt * 2;
      return;
    }

    if (s.kind === "eel") {
      updateEel(p, dt, px);
      return;
    }

    const hungry = p.full < 0.9;
    const food = hungry ? nearestFood(p, s.kind === "shrimp" ? W * 0.35 : W * 0.9) : null;

    if (s.kind === "shrimp") {
      p.phase += dt * 6;
      p.steerT -= dt;
      let targetX = null;
      if (food) targetX = food.x;
      else if (p.steerT <= 0) { p.steerT = rnd(1.4, 4); p.vx = rnd(-16, 16) || 10; }
      if (targetX != null) {
        const dir = Math.sign(targetX - p.x) || 1;
        p.vx = lerp(p.vx, dir * 26, 1 - Math.pow(0.001, dt));
      }
      p.x += p.vx * dt * slow;
      if (p.x < px * 0.7) { p.x = px * 0.7; p.vx = Math.abs(p.vx); }
      if (p.x > W - px * 0.7) { p.x = W - px * 0.7; p.vx = -Math.abs(p.vx); }
      p.y = lerp(p.y, sandTop() - px * 0.2, 1 - Math.pow(0.01, dt));
      tryEat(p, px * 0.8);
      return;
    }

    // fish steering
    let dax, day;
    if (food) {
      dax = food.x - p.x;
      day = food.y - p.y;
    } else {
      p.steerT -= dt;
      if (p.steerT <= 0) {
        p.steerT = rnd(1.2, 3.4);
        p.wander = rnd(0, Math.PI * 2);
      }
      dax = Math.cos(p.wander);
      day = Math.sin(p.wander) * 0.35 + Math.sin(time * 0.6 + p.id) * 0.12;
      if (s.bottom) day += (floor - 6 - p.y) * 0.02;
    }

    // walls push inward
    const margin = px * 1.1;
    if (p.x < margin) dax += (margin - p.x) * 0.12;
    if (p.x > W - margin) dax -= (p.x - (W - margin)) * 0.12;
    if (p.y < top + 8) day += (top + 8 - p.y) * 0.16;
    if (p.y > floor - 6) day -= (p.y - (floor - 6)) * 0.16;

    const len = Math.hypot(dax, day) || 1;
    const base = (s.bottom ? 20 : 27) * (food ? 2.1 : 1) * slow * lerp(0.55, 1, p.full * 0.6 + 0.4);
    const wantX = dax / len * base;
    const wantY = day / len * base * 0.8;
    const k = 1 - Math.pow(0.02, dt);
    p.vx = lerp(p.vx, wantX, k);
    p.vy = lerp(p.vy, wantY, k);

    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.x = clamp(p.x, px * 0.55, W - px * 0.55);
    p.y = clamp(p.y, top, floor);

    const speed = Math.hypot(p.vx, p.vy);
    p.phase += dt * (3 + speed * 0.16);

    tryEat(p, px * 0.6);
  }

  // garden eels stay in their burrow: they sway, lean after drifting food,
  // and duck back into the sand when something startles them.
  function updateEel(p, dt, px) {
    p.x = clamp(p.x, px * 0.3, W - px * 0.3);
    p.y = sandBase(p.x);
    p.phase += dt * (state.night ? 0.5 : 1.05);
    if (p.shy > 0) p.shy -= dt;

    let target = 1;
    if (state.night) target = 0.1;
    if (p.shy > 0) target = Math.min(target, 0.14);

    // a fish swimming right past makes them shrink back a little
    for (const o of state.pets) {
      if (o === p || SPECIES[o.key].kind !== "fish") continue;
      const oL = petPx(o);
      if (oL < px * 0.5) continue;
      if (Math.hypot(o.x - p.x, o.y - (p.y - px * p.ext * 0.7)) < px * 0.6) {
        target = Math.min(target, 0.4);
        break;
      }
    }

    p.ext = lerp(p.ext, target, 1 - Math.pow(p.ext > target ? 0.0004 : 0.35, dt));

    const headY = p.y - px * p.ext;
    const food = p.full < 0.95 ? nearestFoodAt(p.x, headY, px * 1.7) : null;
    const want = food ? clamp((food.x - p.x) / (px * 0.5), -1, 1) : 0;
    p.lean = lerp(p.lean, want, 1 - Math.pow(0.06, dt));

    if (p.ext > 0.5) tryEat(p, px * 0.42, eelHeadX(p, px), headY);
  }

  function eelHeadX(p, px) {
    return p.x + (Math.sin(p.phase + 2.3) * px * 0.13 * (1 - Math.abs(p.lean) * 0.6)
                  + p.lean * px * 0.42) * p.ext;
  }

  function nearestFoodAt(x, y, reach) {
    let best = null, bd = reach * reach;
    for (const f of state.food) {
      const dx = f.x - x, dy = f.y - y;
      const d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = f; }
    }
    return best;
  }

  function tryEat(p, reach, hx, hy) {
    if (p.full >= 1) return;
    const ax = hx != null ? hx : p.x;
    const ay = hy != null ? hy : p.y;
    for (let i = state.food.length - 1; i >= 0; i--) {
      const f = state.food[i];
      if (Math.hypot(f.x - ax, f.y - ay) < reach) {
        state.food.splice(i, 1);
        p.full = clamp(p.full + 0.3, 0, 1);
        for (let j = 0; j < 4; j++) {
          sparks.push({ x: f.x, y: f.y, vx: rnd(-22, 22), vy: rnd(-22, 6), life: 0.6, max: 0.6 });
        }
        return;
      }
    }
  }

  function updateFood(dt) {
    const floor = sandTop();
    for (let i = state.food.length - 1; i >= 0; i--) {
      const f = state.food[i];
      f.age += dt;
      if (f.y < floor - 2) {
        f.y += 26 * dt;
        f.x += Math.sin(time * 1.6 + f.seed) * 5 * dt;
      } else {
        f.rest += dt;
        if (f.rest > 26) {
          state.food.splice(i, 1);
          state.dirt = clamp(state.dirt + 0.012, 0, 1);
        }
      }
    }
  }

  function sprinkle(x, y) {
    if (state.food.length > 44) return;
    const n = 5;
    for (let i = 0; i < n; i++) {
      state.food.push({
        x: clamp(x + rnd(-16, 16), 8, W - 8),
        y: Math.max(waterTop() + 3, (y != null ? y - rnd(0, 20) : waterTop() + 6)),
        age: 0, rest: 0, seed: rnd(0, 10)
      });
    }
  }

  function updateAmbient(dt) {
    // spark particles
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.life -= dt;
      s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 14 * dt;
      if (s.life <= 0) sparks.splice(i, 1);
    }

    // bubbles: airstones + occasional ambient
    const stones = state.decor.filter(d => d.key === "airstone");
    updateAmbient.acc = (updateAmbient.acc || 0) + dt;
    if (updateAmbient.acc > 0.09) {
      updateAmbient.acc = 0;
      for (const st of stones) {
        if (bubbles.length < 110) {
          bubbles.push({ x: st.x + rnd(-7, 7), y: sandTop() - 6, r: rnd(1.6, 3.6), sp: rnd(28, 52), seed: rnd(0, 10) });
        }
      }
      if (!REDUCED && bubbles.length < 12 && Math.random() < 0.06) {
        bubbles.push({ x: rnd(10, W - 10), y: sandTop() - rnd(0, H * 0.3), r: rnd(1, 2.2), sp: rnd(16, 30), seed: rnd(0, 10) });
      }
    }
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.y -= b.sp * dt;
      b.x += Math.sin(time * 2.2 + b.seed) * 7 * dt;
      if (b.y < waterTop() + 2) bubbles.splice(i, 1);
    }

    if (cleanFlash > 0) cleanFlash = Math.max(0, cleanFlash - dt);
    if (feedMode) {
      feedTimer -= dt;
      if (feedTimer <= 0) setFeedMode(false);
    }
  }

  /* ------------------------------------------------------------------ *
   * drawing: creatures
   * ------------------------------------------------------------------ */

  function drawFishShape(g, s, L, phase, pale) {
    const Hh = L * s.ratio;
    const wag = Math.sin(phase) * 0.34;
    const finWag = Math.sin(phase * 1.3) * 0.5;

    g.save();
    if (pale) g.globalAlpha *= 0.82;

    // ---- tail ----
    g.save();
    g.translate(-L * 0.40, 0);
    g.rotate(wag);
    g.fillStyle = s.fin;
    g.globalAlpha *= 0.92;
    g.beginPath();
    if (s.tail === "fork") {
      g.moveTo(0, 0);
      g.lineTo(-L * 0.30, -Hh * 0.72);
      g.quadraticCurveTo(-L * 0.16, 0, -L * 0.30, Hh * 0.72);
      g.closePath();
    } else if (s.tail === "veil") {
      g.moveTo(0, 0);
      g.quadraticCurveTo(-L * 0.30, -Hh * 0.95, -L * 0.44, -Hh * 0.30);
      g.quadraticCurveTo(-L * 0.36, 0, -L * 0.44, Hh * 0.30);
      g.quadraticCurveTo(-L * 0.30, Hh * 0.95, 0, 0);
    } else {
      g.moveTo(0, -Hh * 0.18);
      g.quadraticCurveTo(-L * 0.30, -Hh * 0.85, -L * 0.56, -Hh * 0.52);
      g.quadraticCurveTo(-L * 0.50, -Hh * 0.05, -L * 0.60, Hh * 0.40);
      g.quadraticCurveTo(-L * 0.38, Hh * 0.30, -L * 0.22, Hh * 0.62);
      g.quadraticCurveTo(-L * 0.14, Hh * 0.28, 0, Hh * 0.18);
      g.closePath();
    }
    g.fill();
    g.restore();

    // ---- dorsal + anal fins ----
    g.fillStyle = s.fin;
    g.globalAlpha *= 0.85;
    g.beginPath();
    g.moveTo(L * 0.06, -Hh * 0.42);
    if (s.tall) {
      g.quadraticCurveTo(L * 0.02, -Hh * 1.5, -L * 0.28, -Hh * 0.9);
    } else {
      g.quadraticCurveTo(-L * 0.04, -Hh * 0.98, -L * 0.24, -Hh * 0.44);
    }
    g.closePath();
    g.fill();

    g.beginPath();
    g.moveTo(L * 0.02, Hh * 0.42);
    if (s.tall) g.quadraticCurveTo(-L * 0.06, Hh * 1.5, -L * 0.28, Hh * 0.85);
    else g.quadraticCurveTo(-L * 0.08, Hh * 0.86, -L * 0.24, Hh * 0.42);
    g.closePath();
    g.fill();
    g.globalAlpha /= 0.85;

    // ---- body ----
    const body = new Path2D();
    body.moveTo(L * 0.50, 0);
    body.quadraticCurveTo(L * 0.18, -Hh * 0.52, -L * 0.10, -Hh * 0.46);
    body.quadraticCurveTo(-L * 0.34, -Hh * 0.26, -L * 0.42, 0);
    body.quadraticCurveTo(-L * 0.34, Hh * 0.26, -L * 0.10, Hh * 0.46);
    body.quadraticCurveTo(L * 0.18, Hh * 0.52, L * 0.50, 0);

    const grad = g.createLinearGradient(0, -Hh * 0.55, 0, Hh * 0.55);
    grad.addColorStop(0, s.c2);
    grad.addColorStop(0.55, s.c1);
    grad.addColorStop(1, shade(s.c1, -0.22));
    g.fillStyle = grad;
    g.fill(body);

    // ---- markings ----
    g.save();
    g.clip(body);
    if (s.mark === "neon") {
      g.fillStyle = "#3fe0ff";
      g.globalAlpha = 0.9;
      g.fillRect(-L * 0.45, -Hh * 0.20, L, Hh * 0.16);
      g.fillStyle = "#ff4d5e";
      g.fillRect(-L * 0.45, Hh * 0.02, L * 0.7, Hh * 0.18);
    } else if (s.mark === "tiger") {
      g.fillStyle = "rgba(46,38,30,.5)";
      for (let i = -1; i <= 1; i++) {
        g.save();
        g.translate(L * 0.14 + i * L * 0.28, 0);
        g.rotate(0.1);
        g.fillRect(-L * 0.06, -Hh * 0.62, L * 0.12, Hh * 1.24);
        g.restore();
      }
    } else if (s.mark === "spots") {
      const r = mulberry32(4242);
      g.fillStyle = "rgba(60,40,20,.34)";
      for (let i = 0; i < 9; i++) {
        g.beginPath();
        g.arc(-L * 0.35 + r() * L * 0.75, (r() - 0.5) * Hh * 0.8, L * 0.035, 0, 7);
        g.fill();
      }
    }
    // belly sheen
    const sheen = g.createLinearGradient(0, -Hh * 0.5, 0, 0);
    sheen.addColorStop(0, "rgba(255,255,255,.30)");
    sheen.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = sheen;
    g.fill(body);
    g.restore();

    // ---- pectoral fin ----
    g.save();
    g.translate(L * 0.14, Hh * 0.16);
    g.rotate(finWag * 0.5);
    g.fillStyle = s.fin;
    g.globalAlpha *= 0.8;
    g.beginPath();
    g.ellipse(-L * 0.07, 0, L * 0.10, Hh * 0.14, 0.4, 0, 7);
    g.fill();
    g.restore();

    // ---- eye ----
    g.fillStyle = "#f6fbfb";
    g.beginPath();
    g.arc(L * 0.30, -Hh * 0.10, Math.max(1.6, L * 0.055), 0, 7);
    g.fill();
    g.fillStyle = "#0d1416";
    g.beginPath();
    g.arc(L * 0.315, -Hh * 0.10, Math.max(0.9, L * 0.030), 0, 7);
    g.fill();

    g.restore();
  }

  function drawShrimpShape(g, s, L, phase, pale) {
    g.save();
    if (pale) g.globalAlpha *= 0.85;
    const legs = Math.sin(phase) * 0.4;

    // legs
    g.strokeStyle = shade(s.c1, -0.15);
    g.lineWidth = Math.max(0.7, L * 0.045);
    g.lineCap = "round";
    for (let i = 0; i < 4; i++) {
      const bx = -L * 0.18 + i * L * 0.14;
      g.beginPath();
      g.moveTo(bx, L * 0.12);
      g.lineTo(bx - L * 0.05, L * 0.28 + Math.sin(phase + i) * L * 0.04);
      g.stroke();
    }

    // body arc
    const grad = g.createLinearGradient(0, -L * 0.3, 0, L * 0.2);
    grad.addColorStop(0, s.c2);
    grad.addColorStop(1, s.c1);
    g.fillStyle = grad;
    g.beginPath();
    g.moveTo(L * 0.44, 0);
    g.quadraticCurveTo(L * 0.10, -L * 0.34, -L * 0.26, -L * 0.16);
    g.quadraticCurveTo(-L * 0.44, -L * 0.06, -L * 0.40, L * 0.14);
    g.quadraticCurveTo(-L * 0.16, L * 0.20, L * 0.14, L * 0.12);
    g.quadraticCurveTo(L * 0.34, L * 0.06, L * 0.44, 0);
    g.fill();

    g.strokeStyle = "rgba(40,60,52,.28)";
    g.lineWidth = Math.max(0.6, L * 0.028);
    for (let i = 0; i < 4; i++) {
      const bx = L * 0.18 - i * L * 0.15;
      g.beginPath();
      g.moveTo(bx, -L * 0.24 + i * L * 0.02);
      g.quadraticCurveTo(bx - L * 0.04, 0, bx - L * 0.02, L * 0.14);
      g.stroke();
    }

    if (s.banded) {
      g.fillStyle = "rgba(255,252,250,.85)";
      for (let i = 0; i < 3; i++) {
        g.save();
        g.translate(L * 0.16 - i * L * 0.20, -L * 0.06);
        g.rotate(-0.25);
        g.fillRect(-L * 0.04, -L * 0.16, L * 0.075, L * 0.32);
        g.restore();
      }
    }

    // tail fan
    g.fillStyle = shade(s.c1, 0.12);
    g.beginPath();
    g.moveTo(-L * 0.36, -L * 0.04);
    g.lineTo(-L * 0.56, -L * 0.20 + legs * L * 0.05);
    g.lineTo(-L * 0.54, L * 0.20 + legs * L * 0.05);
    g.closePath();
    g.fill();

    // antennae
    g.strokeStyle = "rgba(230,246,244,.55)";
    g.lineWidth = Math.max(0.6, L * 0.035);
    g.beginPath();
    g.moveTo(L * 0.4, -L * 0.04);
    g.quadraticCurveTo(L * 0.72, -L * 0.22 + legs * L * 0.08, L * 0.92, -L * 0.10);
    g.moveTo(L * 0.4, 0);
    g.quadraticCurveTo(L * 0.70, L * 0.16 - legs * L * 0.08, L * 0.90, L * 0.20);
    g.stroke();

    // eye
    g.fillStyle = "#101a1c";
    g.beginPath();
    g.arc(L * 0.30, -L * 0.11, Math.max(1, L * 0.055), 0, 7);
    g.fill();
    g.restore();
  }

  function drawSnailShape(g, s, L, phase) {
    g.save();
    // foot
    g.fillStyle = "#e5d7bd";
    g.beginPath();
    g.ellipse(0, L * 0.30, L * 0.52, L * 0.14, 0, 0, 7);
    g.fill();
    // shell spiral
    g.save();
    g.translate(-L * 0.04, -L * 0.02);
    const grad = g.createLinearGradient(0, -L * 0.4, 0, L * 0.3);
    grad.addColorStop(0, s.c2);
    grad.addColorStop(1, s.c1);
    g.fillStyle = grad;
    g.beginPath();
    g.arc(0, 0, L * 0.44, 0, 7);
    g.fill();
    g.strokeStyle = "rgba(30,22,14,.55)";
    g.lineWidth = Math.max(0.8, L * 0.06);
    g.beginPath();
    for (let a = 0; a < 12; a += 0.2) {
      const r = L * 0.44 * (1 - a / 13);
      const px = Math.cos(a + phase * 0.02) * r, py = Math.sin(a + phase * 0.02) * r;
      a === 0 ? g.moveTo(px, py) : g.lineTo(px, py);
    }
    g.stroke();
    g.restore();
    // head
    g.fillStyle = "#e5d7bd";
    g.beginPath();
    g.ellipse(L * 0.46, L * 0.20, L * 0.16, L * 0.11, 0, 0, 7);
    g.fill();
    g.strokeStyle = "#e5d7bd";
    g.lineWidth = Math.max(0.7, L * 0.05);
    g.lineCap = "round";
    g.beginPath();
    g.moveTo(L * 0.52, L * 0.14);
    g.lineTo(L * 0.66, L * 0.02 + Math.sin(phase) * L * 0.03);
    g.moveTo(L * 0.46, L * 0.12);
    g.lineTo(L * 0.56, -L * 0.04 + Math.cos(phase) * L * 0.03);
    g.stroke();
    g.restore();
  }

  function drawEelShape(g, s, L, phase, ext, lean, seed, pale, current) {
    const e = clamp(ext, 0, 1);

    // the burrow itself, always visible
    g.fillStyle = "rgba(122,104,73,.5)";
    g.beginPath();
    g.ellipse(0, 0, L * 0.11, L * 0.032, 0, 0, 7);
    g.fill();
    if (e < 0.05) return;

    g.save();
    if (pale) g.globalAlpha *= 0.85;

    const N = 18;
    const swayAmp = L * 0.16 * (1 - Math.abs(lean) * 0.55);
    // a slow shared current makes a colony lean together, plus each eel's own wave
    const nx = t => (Math.sin(phase + t * 2.6) * swayAmp
                     + Math.sin(current) * L * 0.13 * t
                     + lean * L * 0.42) * Math.pow(t, 1.25) * e;
    const ny = t => -L * e * t;
    const hw = t => L * 0.084 * (1 - t * 0.17) + L * 0.012 * Math.max(0, 1 - t * 9);
    const headR = L * 0.098;

    const body = new Path2D();
    body.moveTo(nx(0) - hw(0), ny(0));
    for (let i = 1; i <= N; i++) { const t = i / N; body.lineTo(nx(t) - hw(t), ny(t)); }
    body.arc(nx(1), ny(1), hw(1), Math.PI, 0, true);
    for (let i = N; i >= 0; i--) { const t = i / N; body.lineTo(nx(t) + hw(t), ny(t)); }
    body.closePath();

    const grad = g.createLinearGradient(-L * 0.1, 0, L * 0.1, 0);
    grad.addColorStop(0, s.c1);
    grad.addColorStop(0.45, s.c2);
    grad.addColorStop(1, shade(s.c1, -0.14));
    g.fillStyle = grad;
    g.fill(body);

    // spotting: fine speckles plus the three big blotches
    g.save();
    g.clip(body);
    const r = mulberry32(seed);
    g.fillStyle = "rgba(66,62,54,.5)";
    for (let i = 0; i < 30; i++) {
      const t = r() * 0.88;
      g.beginPath();
      g.arc(nx(t) + (r() - 0.5) * hw(t) * 1.7, ny(t), L * 0.011, 0, 7);
      g.fill();
    }
    // two soft blotches, each pushed off-centre so they do not read as bands
    g.fillStyle = "rgba(54,50,44,.58)";
    for (const t of [0.26 + r() * 0.1, 0.58 + r() * 0.1]) {
      g.beginPath();
      g.ellipse(nx(t) + (r() - 0.5) * hw(t), ny(t), hw(t) * 0.95, L * 0.05, 0, 0, 7);
      g.fill();
    }
    // shaded side, so the body reads as round
    const shading = g.createLinearGradient(-hw(0.5) * 1.2, 0, hw(0.5) * 1.2, 0);
    shading.addColorStop(0, "rgba(70,62,48,.22)");
    shading.addColorStop(0.42, "rgba(70,62,48,0)");
    shading.addColorStop(0.78, "rgba(255,255,255,.11)");
    shading.addColorStop(1, "rgba(60,52,40,.18)");
    g.fillStyle = shading;
    g.fill(body);
    g.restore();

    // head
    const hx = nx(1), hy = ny(1);
    const tiltH = Math.atan2(nx(1) - nx(0.86), -(ny(1) - ny(0.86)));
    g.save();
    g.translate(hx, hy);
    g.rotate(tiltH);

    // The head silhouette is a cranium plus two bulging eyes and a snout.
    // Garden eels really do have eyes that stick out sideways, and the bumps
    // are what keeps this from reading as a smooth skull.
    const eyeDX = headR * 0.66;
    const eyeDY = -headR * 0.06;
    const bulge = headR * 0.46;
    const TAU = Math.PI * 2;

    const headPath = new Path2D();
    headPath.moveTo(headR * 0.8, -headR * 0.1);
    headPath.ellipse(0, -headR * 0.1, headR * 0.8, headR * 0.92, 0, 0, TAU);
    headPath.moveTo(-eyeDX + bulge, eyeDY);
    headPath.arc(-eyeDX, eyeDY, bulge, 0, TAU);
    headPath.moveTo(eyeDX + bulge, eyeDY);
    headPath.arc(eyeDX, eyeDY, bulge, 0, TAU);
    headPath.moveTo(headR * 0.44, headR * 0.6);
    headPath.ellipse(0, headR * 0.6, headR * 0.44, headR * 0.38, 0, 0, TAU);

    const hg = g.createRadialGradient(-headR * 0.3, -headR * 0.6, headR * 0.1,
                                      0, 0, headR * 1.5);
    hg.addColorStop(0, "#fffaec");
    hg.addColorStop(0.55, "#f2e9d5");
    hg.addColorStop(1, "#cfc2a6");
    g.fillStyle = hg;
    g.fill(headPath);

    // the body's speckling carries onto the head, so it reads as an animal
    g.save();
    g.clip(headPath);
    g.fillStyle = "rgba(96,86,66,.34)";
    for (let i = 0; i < 14; i++) {
      g.beginPath();
      g.arc((r() - 0.5) * headR * 2.4, (r() - 0.5) * headR * 1.9, headR * 0.07, 0, 7);
      g.fill();
    }
    g.fillStyle = "rgba(226,138,122,.24)";
    for (const sx of [-1, 1]) {
      g.beginPath();
      g.ellipse(sx * headR * 0.72, headR * 0.34, headR * 0.24, headR * 0.16, 0, 0, 7);
      g.fill();
    }
    g.restore();

    // eyes: beady, sitting in the bulges, with a warm rim rather than a hard edge
    const pr = Math.max(0.9, bulge * 0.66);
    for (const sx of [-1, 1]) {
      const ex = sx * eyeDX;
      g.fillStyle = "rgba(150,132,102,.35)";
      g.beginPath();
      g.arc(ex, eyeDY, pr * 1.22, 0, 7);
      g.fill();
      g.fillStyle = "#2b2318";
      g.beginPath();
      g.arc(ex, eyeDY, pr, 0, 7);
      g.fill();
      g.fillStyle = "rgba(255,255,255,.95)";
      g.beginPath();
      g.arc(ex - pr * 0.3, eyeDY - pr * 0.34, Math.max(0.4, pr * 0.34), 0, 7);
      g.fill();
      g.fillStyle = "rgba(255,255,255,.45)";
      g.beginPath();
      g.arc(ex + pr * 0.3, eyeDY + pr * 0.32, Math.max(0.25, pr * 0.16), 0, 7);
      g.fill();
    }

    // a small open mouth at the tip of the snout
    g.fillStyle = "rgba(94,66,52,.8)";
    g.beginPath();
    g.ellipse(0, headR * 0.78, headR * 0.17, headR * 0.13, 0, 0, 7);
    g.fill();
    g.restore();   // head transform
    g.restore();   // body
  }

  function drawPet(g, p) {
    const s = SPECIES[p.key];
    const L = petPx(p);
    const pale = p.full < 0.25;

    g.save();
    g.translate(p.x, p.y);

    if (s.kind === "eel") {
      drawEelShape(g, s, L, p.phase, p.ext, p.lean, p.id * 977 + 13, pale, time * 0.33);
    } else if (s.kind === "fish") {
      const flip = p.vx < 0 ? -1 : 1;
      const tilt = clamp(Math.atan2(p.vy, Math.abs(p.vx) + 4), -0.55, 0.55);
      g.scale(flip, 1);
      g.rotate(tilt);
      drawFishShape(g, s, L, p.phase, pale);
    } else if (s.kind === "shrimp") {
      const flip = p.vx < 0 ? -1 : 1;
      g.scale(flip, 1);
      drawShrimpShape(g, s, L, p.phase, pale);
    } else {
      const flip = p.vx < 0 ? -1 : 1;
      g.scale(flip, 1);
      drawSnailShape(g, s, L, p.phase);
    }
    g.restore();

    const isEel = s.kind === "eel";
    const markY = isEel ? p.y - L * p.ext - L * 0.16 : p.y - L * 0.65;

    // hunger marker
    if (p.full < 0.22 && (!isEel || p.ext > 0.4)) {
      const a = 0.45 + Math.sin(time * 3 + p.id) * 0.25;
      g.save();
      g.globalAlpha = a;
      g.fillStyle = "#ffb35c";
      g.beginPath();
      g.arc(p.x, markY, Math.max(1.8, L * 0.09), 0, 7);
      g.fill();
      g.restore();
    }

    // selection ring
    if (selected && selected.type === "pet" && selected.id === p.id) {
      g.save();
      g.strokeStyle = "rgba(127,227,205,.85)";
      g.lineWidth = 1.6;
      g.setLineDash([4, 4]);
      g.lineDashOffset = -time * 14;
      g.beginPath();
      if (isEel) {
        g.ellipse(p.x, p.y - L * p.ext * 0.5, L * 0.3, L * p.ext * 0.62 + L * 0.12, 0, 0, 7);
      } else {
        g.ellipse(p.x, p.y, L * 0.78, L * 0.55, 0, 0, 7);
      }
      g.stroke();
      g.restore();
    }
  }

  /* ------------------------------------------------------------------ *
   * drawing: decor
   * ------------------------------------------------------------------ */

  // a closed, irregular blob: radial points jittered by `rand`, smoothed with
  // quadratics through their midpoints so the outline reads as stone, not an ellipse
  function blobPath(cx, cy, rx, ry, rand, n, rough) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const k = 1 - rough * 0.5 + rand() * rough;
      pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
    }
    const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    const path = new Path2D();
    let m = mid(pts[n - 1], pts[0]);
    path.moveTo(m[0], m[1]);
    for (let i = 0; i < n; i++) {
      const p = pts[i], q = pts[(i + 1) % n];
      const mm = mid(p, q);
      path.quadraticCurveTo(p[0], p[1], mm[0], mm[1]);
    }
    path.closePath();
    return path;
  }

  // sample a quadratic bezier into a polyline
  function curvePts(x0, y0, cx, cy, x1, y1, n) {
    const out = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, u = 1 - t;
      out.push([u * u * x0 + 2 * u * t * cx + t * t * x1,
                u * u * y0 + 2 * u * t * cy + t * t * y1]);
    }
    return out;
  }

  // a line running parallel to a polyline, at `f` of its half width (-1..1);
  // `wob` lets the width breathe so limbs are not perfect cones
  function limbEdge(pts, w0, w1, f, wob) {
    const n = pts.length, out = [];
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      const w = lerp(w0, w1, t) * (wob ? wob(t) : 1) / 2;
      const p = pts[i];
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
      let dx = b[0] - a[0], dy = b[1] - a[1];
      const len = Math.hypot(dx, dy) || 1;
      dx /= len; dy /= len;
      out.push([p[0] - dy * w * f, p[1] + dx * w * f]);
    }
    return out;
  }

  function limbPath(pts, w0, w1, wob) {
    const left = limbEdge(pts, w0, w1, 1, wob);
    const right = limbEdge(pts, w0, w1, -1, wob);
    const path = new Path2D();
    path.moveTo(left[0][0], left[0][1]);
    for (let i = 1; i < left.length; i++) path.lineTo(left[i][0], left[i][1]);
    for (let i = right.length - 1; i >= 0; i--) path.lineTo(right[i][0], right[i][1]);
    path.closePath();
    return path;
  }

  function strokePolyline(g, pts) {
    g.beginPath();
    pts.forEach((pt, i) => (i === 0 ? g.moveTo(pt[0], pt[1]) : g.lineTo(pt[0], pt[1])));
    g.stroke();
  }

  const SOLID_DECOR = { rock: 1, driftwood: 1, castle: 1, marimo: 1, coral: 1, shell: 1 };

  function drawDecor(g, d, baseY, sizeOverride) {
    const s = sizeOverride || decorPx(d);
    const r = mulberry32(d.seed);
    g.save();
    g.translate(d.x, baseY);

    // where a solid object meets the sand
    if (SOLID_DECOR[d.key] && !sizeOverride) {
      const sg = g.createRadialGradient(0, 0, s * 0.04, 0, 0, s * 0.62);
      sg.addColorStop(0, "rgba(58,44,26,.34)");
      sg.addColorStop(1, "rgba(58,44,26,0)");
      g.fillStyle = sg;
      g.beginPath();
      g.ellipse(0, s * 0.02, s * 0.62, s * 0.1, 0, 0, 7);
      g.fill();
    }

    g.scale(d.flip, 1);

    switch (d.key) {
      case "plant": {
        const stems = 7;
        for (let i = 0; i < stems; i++) {
          const off = (i - (stems - 1) / 2) * s * 0.10 + (r() - 0.5) * s * 0.05;
          const h = s * (0.6 + r() * 0.55);
          const dark = i % 2 === 0;
          const sway = Math.sin(time * 0.8 + i * 0.8 + d.seed * 0.31) * s * 0.16;
          const stemX = t => off + sway * t * t;
          const stemY = t => -h * t;

          g.strokeStyle = dark ? "#2f7a49" : "#43955a";
          g.lineWidth = Math.max(1.4, s * 0.042);
          g.lineCap = "round";
          g.beginPath();
          g.moveTo(off, 0);
          for (let k = 1; k <= 8; k++) { const t = k / 8; g.lineTo(stemX(t), stemY(t)); }
          g.stroke();

          const leaves = 5;
          for (let k = 1; k <= leaves; k++) {
            const t = k / (leaves + 0.6);
            const side = k % 2 ? 1 : -1;
            const grow = 1 - t * 0.45;
            g.save();
            g.translate(stemX(t), stemY(t));
            g.rotate(side * (0.95 - t * 0.35) - sway / s * 0.9);
            const lg = g.createLinearGradient(0, 0, s * 0.16 * grow, 0);
            lg.addColorStop(0, dark ? "#2f7a49" : "#43955a");
            lg.addColorStop(1, dark ? "#5fb573" : "#7ccb87");
            g.fillStyle = lg;
            g.beginPath();
            g.moveTo(0, 0);
            g.quadraticCurveTo(s * 0.09 * grow, -s * 0.055 * grow, s * 0.19 * grow, 0);
            g.quadraticCurveTo(s * 0.09 * grow, s * 0.055 * grow, 0, 0);
            g.fill();
            g.restore();
          }
        }
        break;
      }
      case "shell": {
        g.fillStyle = "#f0e3cc";
        g.beginPath();
        g.moveTo(0, 0);
        g.arc(0, 0, s * 0.5, Math.PI, 0);
        g.closePath();
        g.fill();
        g.strokeStyle = "rgba(150,120,86,.5)";
        g.lineWidth = Math.max(0.7, s * 0.035);
        for (let i = 1; i < 5; i++) {
          const a = Math.PI + (Math.PI / 5) * i;
          g.beginPath();
          g.moveTo(0, 0);
          g.lineTo(Math.cos(a) * s * 0.48, Math.sin(a) * s * 0.48);
          g.stroke();
        }
        break;
      }
      case "rock": {
        const tones = [
          ["#a2a6a1", "#6d726f", "#3e4444"],
          ["#a8a08c", "#77705f", "#443f34"],
          ["#98a1a6", "#6a7377", "#3b4245"]
        ];
        // back to front, so the smaller stones tuck in behind the main one
        const stones = [
          { x: -s * 0.30, w: s * 0.30, h: s * 0.24, t: 1 },
          { x:  s * 0.31, w: s * 0.26, h: s * 0.20, t: 2 },
          { x: -s * 0.02, w: s * 0.42, h: s * 0.36, t: 0 }
        ];
        for (const st of stones) {
          const tone = tones[st.t];
          const cy = -st.h * 0.82;
          const path = blobPath(st.x, cy, st.w, st.h, r, 8, 0.5);

          const grad = g.createLinearGradient(st.x, cy - st.h, st.x, cy + st.h);
          grad.addColorStop(0, tone[0]);
          grad.addColorStop(0.52, tone[1]);
          grad.addColorStop(1, tone[2]);
          g.fillStyle = grad;
          g.fill(path);

          g.save();
          g.clip(path);

          // sunlit top face
          g.fillStyle = "rgba(255,255,255,.16)";
          g.fill(blobPath(st.x - st.w * 0.12, cy - st.h * 0.52, st.w * 0.72, st.h * 0.44, r, 9, 0.4));

          // grain
          g.fillStyle = "rgba(30,32,30,.16)";
          for (let i = 0; i < 22; i++) {
            g.beginPath();
            g.arc(st.x + (r() - 0.5) * st.w * 2, cy + (r() - 0.5) * st.h * 2,
                  s * (0.006 + r() * 0.012), 0, 7);
            g.fill();
          }

          // a crack or two
          g.strokeStyle = "rgba(28,30,29,.22)";
          g.lineWidth = Math.max(0.6, s * 0.011);
          g.lineJoin = "round";
          let cxp = st.x + (r() - 0.5) * st.w * 0.8;
          let cyp = cy - st.h * 0.7;
          g.beginPath();
          g.moveTo(cxp, cyp);
          for (let k = 0; k < 3; k++) {
            cxp += (r() - 0.4) * st.w * 0.4;
            cyp += st.h * (0.3 + r() * 0.25);
            g.lineTo(cxp, cyp);
          }
          g.stroke();

          // algae settling on the upper surface
          g.fillStyle = "rgba(58,96,52,.34)";
          for (let i = 0; i < 4; i++) {
            g.beginPath();
            g.ellipse(st.x + (r() - 0.5) * st.w * 1.5, cy - st.h * (0.35 + r() * 0.5),
                      st.w * (0.1 + r() * 0.18), st.h * 0.12, (r() - 0.5), 0, 7);
            g.fill();
          }
          g.restore();

          // shaded underside, drawn as a rim so the stone sits in the sand
          g.strokeStyle = "rgba(24,26,25,.22)";
          g.lineWidth = Math.max(0.7, s * 0.016);
          g.stroke(path);
        }
        break;
      }
      case "marimo": {
        const rr = s * 0.5;
        const cy = -rr;

        // irregular outline rather than a perfect ball
        const shape = blobPath(0, cy, rr, rr * 0.96, r, 14, 0.14);
        const grad = g.createRadialGradient(-rr * 0.34, cy - rr * 0.4, rr * 0.08, 0, cy, rr * 1.15);
        grad.addColorStop(0, "#8fd27a");
        grad.addColorStop(0.55, "#4f9a52");
        grad.addColorStop(1, "#255c33");
        g.fillStyle = grad;
        g.fill(shape);

        // fuzz: short tufts, denser and shorter than before
        g.lineCap = "round";
        for (let i = 0; i < 90; i++) {
          const a = r() * Math.PI * 2;
          const rad = rr * (0.86 + r() * 0.16);
          const len = rr * (0.05 + r() * 0.09);
          const lift = 1 - Math.max(0, Math.sin(a)) * 0.5;
          g.strokeStyle = "rgba(" + (r() > 0.5 ? "126,196,110" : "62,124,64") + ",.75)";
          g.lineWidth = Math.max(0.5, rr * 0.028);
          g.beginPath();
          g.moveTo(Math.cos(a) * rad * 0.94, cy + Math.sin(a) * rad * 0.94);
          g.lineTo(Math.cos(a) * (rad + len) * lift, cy + Math.sin(a) * (rad + len));
          g.stroke();
        }

        // highlight
        g.fillStyle = "rgba(190,240,170,.2)";
        g.beginPath();
        g.ellipse(-rr * 0.3, cy - rr * 0.42, rr * 0.4, rr * 0.24, -0.4, 0, 7);
        g.fill();
        break;
      }
      case "driftwood": {
        const limbs = [
          // trunk: buried at the left, thick, gently S-curved
          { pts: curvePts(-s * 0.50, -s * 0.03, -s * 0.14, -s * 0.26, s * 0.16, -s * 0.19, 16)
                   .concat(curvePts(s * 0.16, -s * 0.19, s * 0.34, -s * 0.16, s * 0.49, -s * 0.10, 8).slice(1)),
            w0: s * 0.21, w1: s * 0.055,
            wob: t => (0.3 + 0.7 * Math.min(1, t * 7)) * (1 + Math.sin(t * 11) * 0.12) },
          // main branch, rising and forking
          { pts: curvePts(-s * 0.20, -s * 0.16, -s * 0.16, -s * 0.44, s * 0.02, -s * 0.62, 13),
            w0: s * 0.115, w1: s * 0.022, wob: t => 1 + Math.sin(t * 8 + 1.7) * 0.16 },
          { pts: curvePts(-s * 0.10, -s * 0.42, s * 0.06, -s * 0.50, s * 0.22, -s * 0.47, 9),
            w0: s * 0.05, w1: s * 0.016, wob: t => 1 + Math.sin(t * 7 + 3) * 0.14 },
          // stubby broken limb
          { pts: curvePts(-s * 0.34, -s * 0.12, -s * 0.44, -s * 0.22, -s * 0.37, -s * 0.31, 8),
            w0: s * 0.075, w1: s * 0.03,
            wob: t => (0.5 + 0.5 * Math.min(1, t * 5)) * (1 + Math.sin(t * 9 + 2) * 0.12) }
        ];

        for (const limb of limbs) {
          const path = limbPath(limb.pts, limb.w0, limb.w1, limb.wob);
          const grad = g.createLinearGradient(0, -s * 0.62, 0, s * 0.02);
          grad.addColorStop(0, "#8b7351");
          grad.addColorStop(0.4, "#5c4630");
          grad.addColorStop(1, "#31251a");
          g.fillStyle = grad;
          g.fill(path);

          g.save();
          g.clip(path);

          // grain, running with the limb
          g.strokeStyle = "rgba(36,26,16,.3)";
          g.lineWidth = Math.max(0.5, s * 0.008);
          for (const f of [-0.62, -0.24, 0.18, 0.58]) {
            strokePolyline(g, limbEdge(limb.pts, limb.w0, limb.w1, f, limb.wob));
          }

          // light along the upper edge
          g.strokeStyle = "rgba(226,196,150,.42)";
          g.lineWidth = Math.max(0.8, s * 0.014);
          strokePolyline(g, limbEdge(limb.pts, limb.w0, limb.w1, -0.78, limb.wob));

          // dark underside
          g.strokeStyle = "rgba(20,14,9,.34)";
          g.lineWidth = Math.max(0.8, s * 0.018);
          strokePolyline(g, limbEdge(limb.pts, limb.w0, limb.w1, 0.82, limb.wob));

          // knots
          g.fillStyle = "rgba(30,21,13,.55)";
          for (let i = 0; i < 2; i++) {
            const pt = limb.pts[Math.floor(r() * limb.pts.length)];
            g.beginPath();
            g.ellipse(pt[0], pt[1], s * 0.024, s * 0.015, r() * 2, 0, 7);
            g.fill();
          }
          g.restore();
        }

        // sand heaped where the trunk goes under
        const sandTone = state.night ? "158,145,116" : "234,216,178";
        const mound = g.createRadialGradient(-s * 0.44, s * 0.01, s * 0.02, -s * 0.44, s * 0.01, s * 0.2);
        mound.addColorStop(0, "rgba(" + sandTone + ",.92)");
        mound.addColorStop(0.55, "rgba(" + sandTone + ",.8)");
        mound.addColorStop(1, "rgba(" + sandTone + ",0)");
        g.fillStyle = mound;
        g.beginPath();
        g.ellipse(-s * 0.44, s * 0.012, s * 0.2, s * 0.055, 0, 0, 7);
        g.fill();

        // moss matted along the buried end
        g.fillStyle = "rgba(72,118,64,.42)";
        for (let i = 0; i < 8; i++) {
          const bx = -s * 0.46 + r() * s * 0.42;
          g.beginPath();
          g.ellipse(bx, -s * 0.02 - r() * s * 0.045, s * (0.045 + r() * 0.04), s * 0.016,
                    (r() - 0.5) * 0.5, 0, 7);
          g.fill();
        }
        break;
      }
      case "coral": {
        const tipDots = [];
        const branch = (x, y, ang, len, w, depth) => {
          const sway = Math.sin(time * 0.6 + depth * 1.3 + d.seed * 0.21) * 0.07;
          const ex = x + Math.cos(ang + sway) * len;
          const ey = y + Math.sin(ang + sway) * len;
          const cx = x + Math.cos(ang - 0.2) * len * 0.6;
          const cy = y + Math.sin(ang - 0.2) * len * 0.6;
          const pts = curvePts(x, y, cx, cy, ex, ey, 8);
          const path = limbPath(pts, w, w * 0.6);

          const grad = g.createLinearGradient(x - w, y, x + w, y - len);
          grad.addColorStop(0, depth > 1 ? "#b8446a" : "#d4638b");
          grad.addColorStop(0.55, depth > 1 ? "#dd6f95" : "#f091b0");
          grad.addColorStop(1, "#ffc3d4");
          g.fillStyle = grad;
          g.fill(path);

          // rounded joint so the branches read as one organism
          g.beginPath();
          g.arc(x, y, w * 0.5, 0, 7);
          g.fill();

          // polyps
          g.save();
          g.clip(path);
          g.fillStyle = "rgba(255,225,235,.5)";
          for (let k = 0; k < 7; k++) {
            const t = k / 7;
            const pt = pts[Math.floor(t * (pts.length - 1))];
            g.beginPath();
            g.arc(pt[0] + (r() - 0.5) * w * 0.5, pt[1] + (r() - 0.5) * w * 0.5, w * 0.12, 0, 7);
            g.fill();
          }
          g.restore();

          if (depth <= 0) { tipDots.push([ex, ey, w * 0.6]); return; }
          branch(ex, ey, ang - 0.46 - r() * 0.16, len * 0.7, w * 0.62, depth - 1);
          branch(ex, ey, ang + 0.42 + r() * 0.16, len * 0.68, w * 0.6, depth - 1);
          if (depth === 3 && r() > 0.4) {
            branch(ex, ey, ang + (r() - 0.5) * 0.3, len * 0.55, w * 0.45, depth - 2);
          }
        };
        branch(0, 0, -Math.PI / 2, s * 0.3, s * 0.185, 3);

        // soft tips
        g.fillStyle = "rgba(255,198,216,.9)";
        for (const t of tipDots) {
          g.beginPath();
          g.arc(t[0], t[1], t[2] * 0.78, 0, 7);
          g.fill();
        }
        break;
      }
      case "airstone": {
        g.fillStyle = "#3c4a4e";
        g.beginPath();
        if (g.roundRect) g.roundRect(-s * 0.5, -s * 0.42, s, s * 0.42, s * 0.14);
        else g.rect(-s * 0.5, -s * 0.42, s, s * 0.42);
        g.fill();
        g.fillStyle = "#5c6d71";
        g.fillRect(-s * 0.42, -s * 0.36, s * 0.84, s * 0.08);
        if (sizeOverride) {
          g.strokeStyle = "rgba(216,246,255,.6)";
          g.lineWidth = Math.max(1, s * 0.05);
          for (let i = 0; i < 5; i++) {
            g.beginPath();
            g.arc((i - 2) * s * 0.22, -s * (0.7 + (i % 3) * 0.42), s * 0.1, 0, 7);
            g.stroke();
          }
        }
        break;
      }
      case "castle": {
        const bodyGrad = g.createLinearGradient(0, -s * 0.9, 0, 0);
        bodyGrad.addColorStop(0, "#9aa0a3");
        bodyGrad.addColorStop(1, "#5b6366");
        g.fillStyle = bodyGrad;
        g.fillRect(-s * 0.34, -s * 0.62, s * 0.68, s * 0.62);
        g.fillRect(-s * 0.52, -s * 0.82, s * 0.22, s * 0.82);
        g.fillRect(s * 0.30, -s * 0.74, s * 0.22, s * 0.74);
        // battlements
        g.fillStyle = "#7d8487";
        for (let i = 0; i < 3; i++) g.fillRect(-s * 0.52 + i * s * 0.085, -s * 0.9, s * 0.055, s * 0.09);
        for (let i = 0; i < 3; i++) g.fillRect(s * 0.30 + i * s * 0.085, -s * 0.82, s * 0.055, s * 0.09);
        for (let i = 0; i < 5; i++) g.fillRect(-s * 0.34 + i * s * 0.15, -s * 0.70, s * 0.09, s * 0.09);
        // door + windows
        g.fillStyle = "#20282a";
        g.beginPath();
        g.moveTo(-s * 0.09, 0);
        g.lineTo(-s * 0.09, -s * 0.22);
        g.arc(0, -s * 0.22, s * 0.09, Math.PI, 0);
        g.lineTo(s * 0.09, 0);
        g.closePath();
        g.fill();
        g.fillRect(-s * 0.46, -s * 0.62, s * 0.09, s * 0.13);
        g.fillRect(s * 0.36, -s * 0.56, s * 0.09, s * 0.13);
        // moss
        g.fillStyle = "rgba(80,140,80,.35)";
        g.fillRect(-s * 0.34, -s * 0.62, s * 0.68, s * 0.07);
        break;
      }
    }

    g.restore();

    if (selected && selected.type === "decor" && selected.id === d.id) {
      g.save();
      g.strokeStyle = "rgba(127,227,205,.8)";
      g.lineWidth = 1.4;
      g.setLineDash([4, 4]);
      g.lineDashOffset = -time * 14;
      g.beginPath();
      g.ellipse(d.x, baseY - s * 0.28, s * 0.62, s * 0.5, 0, 0, 7);
      g.stroke();
      g.restore();
    }
  }

  /* ------------------------------------------------------------------ *
   * drawing: scene
   * ------------------------------------------------------------------ */

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const f = amt < 0 ? 0 : 255;
    const p = Math.abs(amt);
    r = Math.round(lerp(r, f, p));
    g = Math.round(lerp(g, f, p));
    b = Math.round(lerp(b, f, p));
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  function drawScene() {
    const g = ctx;
    const wt = waterTop(), st = sandTop();
    const night = state.night;

    g.clearRect(0, 0, W, H);

    // water
    const water = g.createLinearGradient(0, 0, 0, H);
    if (night) {
      water.addColorStop(0, "#0a2c3a");
      water.addColorStop(0.5, "#072430");
      water.addColorStop(1, "#04171f");
    } else {
      water.addColorStop(0, "#1a7f97");
      water.addColorStop(0.45, "#0b566d");
      water.addColorStop(1, "#052d3c");
    }
    g.fillStyle = water;
    g.fillRect(0, 0, W, H);

    // algae tint
    if (state.dirt > 0.05) {
      g.fillStyle = "rgba(96,140,64," + (state.dirt * 0.24).toFixed(3) + ")";
      g.fillRect(0, 0, W, H);
    }

    // light rays
    if (!night) {
      g.save();
      g.globalCompositeOperation = "lighter";
      const rayW = [0.030, 0.052, 0.022, 0.044, 0.026];
      for (let i = 0; i < 5; i++) {
        const x = W * (0.10 + i * 0.20) + Math.sin(time * 0.13 + i * 1.7) * W * 0.025;
        const w = W * rayW[i];
        const a = 0.055 + rayW[i] * 1.1;
        const grd = g.createLinearGradient(0, wt, 0, st * 0.96);
        grd.addColorStop(0, "rgba(178,238,255," + a.toFixed(3) + ")");
        grd.addColorStop(0.55, "rgba(178,238,255," + (a * 0.4).toFixed(3) + ")");
        grd.addColorStop(1, "rgba(178,238,255,0)");
        g.fillStyle = grd;
        g.beginPath();
        g.moveTo(x - w * 0.3, wt);
        g.lineTo(x + w * 0.3, wt);
        g.lineTo(x + w * 1.9, st * 0.98);
        g.lineTo(x - w * 1.4, st * 0.98);
        g.closePath();
        g.fill();
      }
      g.restore();
    }

    // sand
    const sand = g.createLinearGradient(0, st - 6, 0, H);
    if (night) { sand.addColorStop(0, "#9d906f"); sand.addColorStop(1, "#5c5340"); }
    else { sand.addColorStop(0, "#ecdcb6"); sand.addColorStop(1, "#a8946f"); }
    g.fillStyle = sand;
    g.beginPath();
    g.moveTo(0, st + 6);
    g.quadraticCurveTo(W * 0.28, st - 8, W * 0.55, st + 2);
    g.quadraticCurveTo(W * 0.82, st + 9, W, st - 3);
    g.lineTo(W, H);
    g.lineTo(0, H);
    g.closePath();
    g.fill();

    // pebbles
    const pr = mulberry32(state.seed);
    g.globalAlpha = night ? 0.3 : 0.45;
    for (let i = 0; i < 42; i++) {
      const x = pr() * W;
      const y = st + 6 + pr() * (H - st - 8);
      const rr = 1 + pr() * 2.6;
      g.fillStyle = pr() > 0.5 ? "#c6b189" : "#8d7f61";
      g.beginPath();
      g.ellipse(x, y, rr, rr * 0.72, 0, 0, 7);
      g.fill();
    }
    g.globalAlpha = 1;

    // caustics on the sand
    if (!night) {
      g.save();
      g.globalCompositeOperation = "lighter";
      const cr = mulberry32(state.seed + 31);
      g.lineCap = "round";
      for (let i = 0; i < 22; i++) {
        const cx = cr() * W;
        const cy = st + 10 + cr() * (H - st - 12);
        const len = 14 + cr() * 46;
        const ph = cr() * 7;
        const pulse = 0.5 + 0.5 * Math.sin(time * 0.9 + ph);
        g.strokeStyle = "rgba(206,244,255," + (0.022 + pulse * 0.042).toFixed(3) + ")";
        g.lineWidth = 1.6 + pulse * 2.2;
        g.beginPath();
        for (let k = 0; k <= 6; k++) {
          const t = k / 6;
          const x = cx - len / 2 + len * t + Math.sin(time * 0.6 + ph) * 4;
          const y = cy + Math.sin(t * 4 + time * 0.8 + ph) * 3.4;
          k === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
        }
        g.stroke();
      }
      g.restore();
    }

    // decor sits on the sand line
    for (const d of state.decor) drawDecor(g, d, sandBase(d.x));

    // food
    g.fillStyle = night ? "#b08a4e" : "#e0a94f";
    for (const f of state.food) {
      g.beginPath();
      g.arc(f.x, f.y, 2.1, 0, 7);
      g.fill();
    }

    // creatures: bottom dwellers first so fish pass in front
    for (const p of state.pets) if (SPECIES[p.key].kind === "eel") drawPet(g, p);
    for (const p of state.pets) {
      const k = SPECIES[p.key].kind;
      if (k !== "fish" && k !== "eel") drawPet(g, p);
    }
    for (const p of state.pets) if (SPECIES[p.key].kind === "fish") drawPet(g, p);

    // sparks
    for (const s of sparks) {
      g.globalAlpha = clamp(s.life / s.max, 0, 1) * 0.8;
      g.fillStyle = "#dff7ff";
      g.beginPath();
      g.arc(s.x, s.y, 1.6, 0, 7);
      g.fill();
    }
    g.globalAlpha = 1;

    // bubbles
    g.strokeStyle = "rgba(216,246,255,.42)";
    g.lineWidth = 1;
    for (const b of bubbles) {
      g.beginPath();
      g.arc(b.x, b.y, b.r, 0, 7);
      g.stroke();
    }

    // floating grime
    if (state.dirt > 0.25) {
      const dr = mulberry32(state.seed + 7);
      const n = Math.floor(state.dirt * 40);
      g.fillStyle = "rgba(150,175,110,.42)";
      for (let i = 0; i < n; i++) {
        const bx = dr() * W;
        const by = wt + dr() * (st - wt);
        const drift = Math.sin(time * 0.25 + i) * 8;
        g.beginPath();
        g.arc((bx + drift + W) % W, by + Math.cos(time * 0.2 + i) * 5, 1 + dr() * 1.4, 0, 7);
        g.fill();
      }
    }

    // cleaning sweep
    if (cleanFlash > 0) {
      const t = 1 - cleanFlash / 0.9;
      const x = t * (W + 160) - 80;
      const grd = g.createLinearGradient(x - 90, 0, x + 90, 0);
      grd.addColorStop(0, "rgba(180,255,240,0)");
      grd.addColorStop(0.5, "rgba(200,255,246,.34)");
      grd.addColorStop(1, "rgba(180,255,240,0)");
      g.fillStyle = grd;
      g.fillRect(x - 90, 0, 180, H);
    }

    // water surface
    g.save();
    const surf = g.createLinearGradient(0, 0, 0, wt + 14);
    surf.addColorStop(0, night ? "rgba(120,180,200,.30)" : "rgba(190,245,255,.42)");
    surf.addColorStop(1, "rgba(190,245,255,0)");
    g.fillStyle = surf;
    g.beginPath();
    g.moveTo(0, 0);
    g.lineTo(W, 0);
    for (let x = W; x >= 0; x -= 10) {
      g.lineTo(x, wt + Math.sin(x * 0.03 + time * 1.3) * 2.2 + Math.sin(x * 0.011 - time * 0.8) * 1.6);
    }
    g.closePath();
    g.fill();
    g.strokeStyle = night ? "rgba(160,215,230,.35)" : "rgba(225,255,255,.55)";
    g.lineWidth = 1.2;
    g.beginPath();
    for (let x = 0; x <= W; x += 10) {
      const y = wt + Math.sin(x * 0.03 + time * 1.3) * 2.2 + Math.sin(x * 0.011 - time * 0.8) * 1.6;
      x === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    g.stroke();
    g.restore();

    // night dim
    if (night) {
      g.fillStyle = "rgba(4,12,18,.36)";
      g.fillRect(0, 0, W, H);
    }

    // vignette
    const vg = g.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.28, W / 2, H * 0.5, Math.max(W, H) * 0.78);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,10,16,.42)");
    g.fillStyle = vg;
    g.fillRect(0, 0, W, H);
  }

  /* ------------------------------------------------------------------ *
   * previews (shop cards / inspect card)
   * ------------------------------------------------------------------ */

  function drawPreview(cv, key) {
    const g = cv.getContext("2d");
    const r = window.devicePixelRatio || 1;
    const cw = cv.clientWidth || cv.width, ch = cv.clientHeight || cv.height;
    cv.width = Math.round(cw * r);
    cv.height = Math.round(ch * r);
    g.setTransform(r, 0, 0, r, 0, 0);
    g.clearRect(0, 0, cw, ch);

    if (SPECIES[key]) {
      const s = SPECIES[key];
      let L;
      if (s.kind === "eel") {
        L = Math.min(cw * 0.85, ch * 0.86);
        g.save();
        g.shadowColor = "rgba(0,0,0,.45)";
        g.shadowBlur = 8;
        g.shadowOffsetY = 3;
        g.translate(cw / 2, ch * 0.94);
        drawEelShape(g, s, L, 0.7, 1, 0, 4242, false, 0.5);
        g.restore();
        return;
      }
      if (s.kind === "fish") {
        const hf = s.ratio * (s.tall ? 1.9 : 1.6);
        L = Math.min(cw * 0.62, ch * 0.9 / hf);
      } else if (s.kind === "shrimp") {
        L = Math.min(cw * 0.52, ch * 0.86);
      } else {
        L = Math.min(cw * 0.42, ch * 0.7);
      }
      g.save();
      g.shadowColor = "rgba(0,0,0,.45)";
      g.shadowBlur = 8;
      g.shadowOffsetY = 3;
      g.translate(cw / 2 + L * 0.06, ch / 2 + (s.kind === "fish" ? 0 : ch * 0.08));
      if (s.kind === "fish") drawFishShape(g, s, L, 0.5, false);
      else if (s.kind === "shrimp") drawShrimpShape(g, s, L, 0.6, false);
      else drawSnailShape(g, s, L, 0.5);
      g.restore();
    } else if (DECOR[key]) {
      const fake = { key, x: cw / 2, flip: 1, seed: 12345 };
      const s = Math.min(cw * 0.58, ch * 0.92);
      g.save();
      g.shadowColor = "rgba(0,0,0,.4)";
      g.shadowBlur = 7;
      g.shadowOffsetY = 2;
      drawDecor(g, fake, ch * 0.9, s);
      g.restore();
    }
  }

  /* ------------------------------------------------------------------ *
   * layout / loop
   * ------------------------------------------------------------------ */

  function resize() {
    const box = document.getElementById("tankBox");
    const rect = box.getBoundingClientRect();
    const nw = Math.max(240, rect.width);
    const nh = Math.max(160, rect.height);
    const sx = W ? nw / W : 1, sy = H ? nh / H : 1;

    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(nw * dpr);
    canvas.height = Math.round(nh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    for (const p of state.pets) { p.x *= sx; p.y *= sy; }
    for (const d of state.decor) d.x *= sx;
    for (const f of state.food) { f.x *= sx; f.y *= sy; }
    bubbles.length = 0;

    W = nw; H = nh;
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    time += dt;

    tickEconomy(dt, false);
    for (const p of state.pets) updatePet(p, dt);
    updateFood(dt);
    updateAmbient(dt);
    drawScene();
    requestAnimationFrame(frame);
  }

  /* ------------------------------------------------------------------ *
   * hud sync
   * ------------------------------------------------------------------ */

  const el = {
    coins: document.getElementById("coins"),
    rate: document.getElementById("rate"),
    pop: document.getElementById("pop"),
    waterGauge: document.getElementById("waterGauge"),
    shopCoins: document.getElementById("shopCoins"),
    tankName: document.getElementById("tankName")
  };

  function syncHud() {
    el.coins.textContent = Math.floor(state.coins);
    el.shopCoins.textContent = Math.floor(state.coins);
    el.rate.textContent = "+" + coinRate().toFixed(1) + "/分";
    el.pop.textContent = state.pets.length + "/" + CAPACITY;
    const q = Math.round((1 - state.dirt) * 100);
    el.waterGauge.firstElementChild.style.width = q + "%";
    el.waterGauge.classList.toggle("is-low", q < 60);
    el.waterGauge.classList.toggle("is-bad", q < 30);
    if (selected && selected.type === "pet") refreshCardMeter();
    if (roster.classList.contains("is-open")) {
      const key = census().map(gr => gr.key + gr.n).join(",");
      key === rosterKey ? refreshRoster() : buildRoster();
    }
  }

  /* ------------------------------------------------------------------ *
   * roster: who lives here, and how many
   * ------------------------------------------------------------------ */

  const popWrap = document.getElementById("popWrap");
  const popBtn = document.getElementById("popBtn");
  const roster = document.getElementById("roster");
  let rosterPinned = false;
  let rosterRows = [];
  let rosterKey = "";

  function census() {
    const groups = new Map();
    for (const p of state.pets) {
      let gr = groups.get(p.key);
      if (!gr) { gr = { key: p.key, n: 0, full: 0, hungry: 0 }; groups.set(p.key, gr); }
      gr.n++;
      gr.full += p.full;
      if (p.full < 0.25) gr.hungry++;
    }
    return [...groups.values()].sort((a, b) =>
      b.n - a.n || SPECIES[b.key].price - SPECIES[a.key].price);
  }

  function buildRoster() {
    const list = census();
    rosterKey = list.map(gr => gr.key + gr.n).join(",");
    rosterRows = [];
    roster.innerHTML = "";

    const head = document.createElement("div");
    head.className = "roster-head";
    head.innerHTML = '<span>住人</span><b id="rosterCount"></b>'
                   + '<span class="grow">毎分</span><b id="rosterRate"></b>';
    roster.appendChild(head);

    if (!list.length) {
      const empty = document.createElement("p");
      empty.className = "roster-empty";
      empty.textContent = "まだ誰もいません。ショップから最初の一匹をむかえましょう。";
      roster.appendChild(empty);
    } else {
      const box = document.createElement("div");
      box.className = "roster-list";
      for (const gr of list) {
        const sp = SPECIES[gr.key];
        const row = document.createElement("div");
        row.className = "rrow";

        const cv = document.createElement("canvas");

        const body = document.createElement("div");
        const top = document.createElement("div");
        top.className = "rrow-top";
        top.innerHTML = '<span>' + sp.name + '</span><span class="n">&times;' + gr.n + '</span>'
                      + '<span class="rate">+' + (sp.rate * gr.n).toFixed(1) + '</span>';

        const bot = document.createElement("div");
        bot.className = "rrow-bot";
        const gauge = document.createElement("span");
        gauge.className = "gauge";
        gauge.innerHTML = "<span></span>";
        const note = document.createElement("span");
        note.className = "hungry";
        bot.append(document.createTextNode("満腹"), gauge, note);

        body.append(top, bot);
        row.append(cv, body);
        box.appendChild(row);
        rosterRows.push({ key: gr.key, gauge, note });
        requestAnimationFrame(() => drawPreview(cv, gr.key));
      }
      roster.appendChild(box);
    }

    const foot = document.createElement("div");
    foot.className = "roster-foot";
    foot.innerHTML = '<span>水質</span><b id="rosterWater"></b>'
                   + '<span class="grow">きげん</span><b id="rosterMood"></b>';
    roster.appendChild(foot);

    refreshRoster();
  }

  function refreshRoster() {
    const list = census();
    const byKey = new Map(list.map(gr => [gr.key, gr]));

    const setText = (id, v) => {
      const el = document.getElementById(id);
      if (el) el.textContent = v;
    };
    setText("rosterCount", state.pets.length + " / " + CAPACITY);
    setText("rosterRate", "+" + coinRate().toFixed(1));
    setText("rosterWater", Math.round((1 - state.dirt) * 100) + "%");
    setText("rosterMood", Math.round(happiness() * 100) + "%");

    for (const row of rosterRows) {
      const gr = byKey.get(row.key);
      if (!gr) continue;
      const avg = Math.round((gr.full / gr.n) * 100);
      row.gauge.firstElementChild.style.width = avg + "%";
      row.gauge.classList.toggle("is-low", avg < 55);
      row.gauge.classList.toggle("is-bad", avg < 25);
      row.note.textContent = gr.hungry ? gr.hungry + "匹 空腹" : "";
    }
  }

  function showRoster() {
    buildRoster();
    roster.classList.add("is-open");
    popBtn.setAttribute("aria-expanded", "true");
  }

  function hideRoster() {
    rosterPinned = false;
    roster.classList.remove("is-open");
    popBtn.setAttribute("aria-expanded", "false");
  }

  popWrap.addEventListener("pointerenter", ev => {
    if (ev.pointerType === "mouse") showRoster();
  });
  popWrap.addEventListener("pointerleave", ev => {
    if (ev.pointerType === "mouse" && !rosterPinned) hideRoster();
  });
  popBtn.addEventListener("click", () => {
    if (rosterPinned) { hideRoster(); return; }
    rosterPinned = true;
    showRoster();
  });
  document.addEventListener("pointerdown", ev => {
    if (roster.classList.contains("is-open") && !popWrap.contains(ev.target)) hideRoster();
  });
  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape") hideRoster();
  });

  /* ------------------------------------------------------------------ *
   * interaction
   * ------------------------------------------------------------------ */

  function canvasPos(ev) {
    const r = canvas.getBoundingClientRect();
    return { x: (ev.clientX - r.left) * (W / r.width), y: (ev.clientY - r.top) * (H / r.height) };
  }

  function hitPet(x, y) {
    let best = null, bd = Infinity;
    for (const p of state.pets) {
      const L = petPx(p);
      if (SPECIES[p.key].kind === "eel") {
        const top = p.y - L * p.ext - L * 0.1;
        if (y < top || y > p.y + L * 0.1) continue;
        const d = Math.abs(x - p.x);
        if (d < L * 0.3 && d < bd) { bd = d; best = p; }
        continue;
      }
      const d = Math.hypot(x - p.x, y - p.y);
      if (d < L * 0.8 && d < bd) { bd = d; best = p; }
    }
    return best;
  }

  function hitDecor(x, y) {
    const st = sandTop();
    let best = null, bd = Infinity;
    for (const d of state.decor) {
      const s = decorPx(d);
      if (y < st - s * 1.1 || y > st + s * 0.4) continue;
      const dx = Math.abs(x - d.x);
      if (dx < s * 0.6 && dx < bd) { bd = dx; best = d; }
    }
    return best;
  }

  let drag = null;

  canvas.addEventListener("pointerdown", ev => {
    canvas.setPointerCapture(ev.pointerId);
    const p = canvasPos(ev);
    drag = { startX: p.x, startY: p.y, moved: false, decor: null };
    if (!feedMode && !hitPet(p.x, p.y)) {
      const d = hitDecor(p.x, p.y);
      if (d) drag.decor = d;
    }
  });

  canvas.addEventListener("pointermove", ev => {
    if (!drag) return;
    const p = canvasPos(ev);
    if (Math.hypot(p.x - drag.startX, p.y - drag.startY) > 6) drag.moved = true;
    if (drag.decor && drag.moved) {
      const s = decorPx(drag.decor);
      drag.decor.x = clamp(p.x, s * 0.5, W - s * 0.5);
    }
  });

  canvas.addEventListener("pointerup", ev => {
    if (!drag) return;
    const p = canvasPos(ev);
    if (drag.decor && drag.moved) {
      save();
    } else if (!drag.moved) {
      if (feedMode) {
        sprinkle(p.x, p.y);
      } else {
        const pet = hitPet(p.x, p.y);
        if (pet) {
          if (SPECIES[pet.key].kind === "eel") pet.shy = rnd(2.6, 4.5);
          openCard("pet", pet.id);
        }
        else {
          const d = hitDecor(p.x, p.y);
          if (d) openCard("decor", d.id);
          else closeCard();
        }
      }
    }
    drag = null;
  });

  canvas.addEventListener("pointercancel", () => { drag = null; });

  /* ---- feed ---- */

  function setFeedMode(on) {
    feedMode = on;
    feedTimer = on ? 9 : 0;
    document.getElementById("feedBtn").classList.toggle("is-armed", on);
    document.getElementById("tankBox").classList.toggle("is-feeding", on);
    if (on) {
      closeCard();
      showHint("水槽をタップして えさをまく");
    } else {
      hideHint();
    }
  }

  document.getElementById("feedBtn").addEventListener("click", () => {
    if (!state.pets.length) { toast("まずはショップで魚をむかえよう"); return; }
    if (feedMode) { setFeedMode(false); return; }
    sprinkle(W * rnd(0.3, 0.7), null);
    setFeedMode(true);
  });

  /* ---- clean ---- */

  document.getElementById("cleanBtn").addEventListener("click", () => {
    if (state.dirt < 0.02) { toast("水はもう澄んでいる"); return; }
    state.dirt = 0;
    cleanFlash = 0.9;
    toast("水がすっきりした");
    syncHud();
    save();
  });

  /* ---- light ---- */

  document.getElementById("lightBtn").addEventListener("click", () => {
    state.night = !state.night;
    document.getElementById("room").classList.toggle("is-night", state.night);
    toast(state.night ? "おやすみモード" : "あかりをつけた");
    save();
  });

  /* ---- sheets ---- */

  const scrim = document.getElementById("scrim");
  const shopSheet = document.getElementById("shop");
  const menuSheet = document.getElementById("menu");

  function openSheet(sheet) {
    closeCard();
    setFeedMode(false);
    shopSheet.classList.remove("is-open");
    menuSheet.classList.remove("is-open");
    sheet.classList.add("is-open");
    scrim.classList.add("is-open");
    syncHud();
  }
  function closeSheets() {
    shopSheet.classList.remove("is-open");
    menuSheet.classList.remove("is-open");
    scrim.classList.remove("is-open");
  }

  scrim.addEventListener("click", () => { closeSheets(); closeCard(); });
  document.getElementById("shopBtn").addEventListener("click", () => { renderShop(); openSheet(shopSheet); });
  document.getElementById("shopClose").addEventListener("click", closeSheets);
  document.getElementById("menuBtn").addEventListener("click", () => openSheet(menuSheet));
  document.getElementById("menuClose").addEventListener("click", closeSheets);

  document.getElementById("howBtn").addEventListener("click", () => {
    closeSheets();
    toast("魚をタップで名前づけ・かざりはドラッグで移動");
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (!confirm("水槽をリセットします。住人もかざりも全部いなくなります。よろしいですか？")) return;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
    location.reload();
  });

  /* ---- shop ---- */

  let shopTab = "fish";

  document.getElementById("shopTabs").addEventListener("click", ev => {
    const b = ev.target.closest(".tab");
    if (!b) return;
    shopTab = b.dataset.tab;
    for (const t of document.querySelectorAll(".tab")) t.classList.toggle("is-on", t === b);
    renderShop();
  });

  function shopItems() {
    if (shopTab === "decor") {
      return Object.keys(DECOR).map(k => ({ key: k, ...DECOR[k], group: "decor" }));
    }
    const wantFish = shopTab === "fish";
    const onFishTab = k => SPECIES[k].kind === "fish" || SPECIES[k].kind === "eel";
    return Object.keys(SPECIES)
      .filter(k => onFishTab(k) === wantFish)
      .map(k => ({ key: k, ...SPECIES[k], group: "pet" }));
  }

  function renderShop() {
    const box = document.getElementById("goods");
    box.innerHTML = "";
    for (const it of shopItems()) {
      const btn = document.createElement("button");
      btn.className = "good";
      const afford = state.coins >= it.price;
      const roomLeft = it.group === "pet" ? state.pets.length < CAPACITY : state.decor.length < DECOR_CAP;
      btn.disabled = !afford || !roomLeft;

      const cv = document.createElement("canvas");
      const name = document.createElement("span");
      name.className = "good-name";
      name.textContent = it.name;
      const note = document.createElement("span");
      note.className = "good-note";
      note.textContent = it.note + (it.rate ? "  毎分+" + it.rate.toFixed(1) : "");
      const price = document.createElement("span");
      price.className = "good-price";
      const dot = document.createElement("span");
      dot.className = "coin-dot";
      price.appendChild(dot);
      price.appendChild(document.createTextNode(String(it.price)));

      btn.append(cv, name, note, price);
      btn.addEventListener("click", () => buy(it));
      box.appendChild(btn);
      requestAnimationFrame(() => drawPreview(cv, it.key));
    }
  }

  function buy(it) {
    if (state.coins < it.price) { toast("コインが足りない"); return; }
    if (it.group === "pet") {
      if (state.pets.length >= CAPACITY) { toast("水槽がいっぱい"); return; }
      state.coins -= it.price;
      const p = makePet(it.key, it.kind === "eel" ? { x: freeEelX() } : {});
      state.pets.push(p);
      toast(it.name + "「" + p.name + "」をむかえた");
    } else {
      if (state.decor.length >= DECOR_CAP) { toast("かざりはこれ以上おけない"); return; }
      state.coins -= it.price;
      state.decor.push(makeDecor(it.key, rnd(W * 0.12, W * 0.88), {}));
      toast(it.name + "をかざった");
    }
    syncHud();
    renderShop();
    save();
  }

  /* ---- inspect card ---- */

  const card = document.getElementById("card");
  const cardName = document.getElementById("cardName");
  const cardMeta = document.getElementById("cardMeta");
  const cardGauge = document.getElementById("cardGauge");
  const cardMeterRow = document.getElementById("cardMeterRow");
  const cardSizeRow = document.getElementById("cardSizeRow");
  const cardSize = document.getElementById("cardSize");
  const cardSizeVal = document.getElementById("cardSizeVal");
  const cardRelease = document.getElementById("cardRelease");
  const cardPreview = document.getElementById("cardPreview");

  function openCard(type, id) {
    const item = type === "pet"
      ? state.pets.find(p => p.id === id)
      : state.decor.find(d => d.id === id);
    if (!item) return;
    selected = { type, id };
    closeSheets();

    if (type === "pet") {
      const s = SPECIES[item.key];
      cardName.value = item.name;
      cardName.disabled = false;
      cardMeta.textContent = s.name + " ・ 毎分+" + s.rate.toFixed(1) + (s.clean ? " ・ そうじ役" : "");
      cardMeterRow.style.display = "";
      cardSizeRow.style.display = "none";
      cardRelease.textContent = "にがす (+" + Math.floor(s.price / 2) + ")";
      card.classList.remove("is-top");
      drawPreview(cardPreview, item.key);
      refreshCardMeter();
    } else {
      const d = DECOR[item.key];
      cardName.value = d.name;
      cardName.disabled = true;
      cardMeta.textContent = "ドラッグで左右に動かせる";
      cardMeterRow.style.display = "none";
      cardSizeRow.style.display = "";
      cardSize.value = Math.round((item.scale || 1) * 100);
      cardSizeVal.textContent = "\u00d7" + (item.scale || 1).toFixed(1);
      cardRelease.textContent = "しまう (+" + Math.floor(d.price / 2) + ")";
      card.classList.add("is-top");
      drawPreview(cardPreview, item.key);
    }
    card.classList.add("is-open");
  }

  function refreshCardMeter() {
    const p = state.pets.find(x => x.id === selected.id);
    if (!p) return;
    const v = Math.round(p.full * 100);
    cardGauge.firstElementChild.style.width = v + "%";
    cardGauge.classList.toggle("is-low", v < 55);
    cardGauge.classList.toggle("is-bad", v < 25);
  }

  function closeCard() {
    selected = null;
    card.classList.remove("is-open");
  }

  document.getElementById("cardClose").addEventListener("click", closeCard);

  cardSize.addEventListener("input", () => {
    if (!selected || selected.type !== "decor") return;
    const d = state.decor.find(x => x.id === selected.id);
    if (!d) return;
    d.scale = clamp(Number(cardSize.value) / 100, DECOR_MIN, DECOR_MAX);
    cardSizeVal.textContent = "\u00d7" + d.scale.toFixed(1);
    const px = decorPx(d);
    d.x = clamp(d.x, px * 0.5, W - px * 0.5);
  });

  cardSize.addEventListener("change", save);

  cardName.addEventListener("input", () => {
    if (!selected || selected.type !== "pet") return;
    const p = state.pets.find(x => x.id === selected.id);
    if (p) { p.name = cardName.value.slice(0, 10); save(); }
  });

  cardRelease.addEventListener("click", () => {
    if (!selected) return;
    if (selected.type === "pet") {
      const i = state.pets.findIndex(p => p.id === selected.id);
      if (i < 0) return;
      const p = state.pets[i];
      state.coins += Math.floor(SPECIES[p.key].price / 2);
      state.pets.splice(i, 1);
      toast("「" + p.name + "」を にがした");
    } else {
      const i = state.decor.findIndex(d => d.id === selected.id);
      if (i < 0) return;
      const d = state.decor[i];
      state.coins += Math.floor(DECOR[d.key].price / 2);
      state.decor.splice(i, 1);
      toast(DECOR[d.key].name + "を しまった");
    }
    closeCard();
    syncHud();
    save();
  });

  /* ---- tank name ---- */

  el.tankName.addEventListener("input", () => {
    state.name = el.tankName.value.slice(0, 14);
    save();
  });

  /* ------------------------------------------------------------------ *
   * boot
   * ------------------------------------------------------------------ */

  resize();
  const hadSave = load();
  if (!hadSave) {
    state.pets.push(makePet("medaka", {}));
    state.decor.push(makeDecor("plant", W * 0.24, {}));
    setTimeout(() => showHint("魚をタップすると名前をつけられる", 5200), 900);
  }
  el.tankName.value = state.name;
  document.getElementById("room").classList.toggle("is-night", state.night);

  new ResizeObserver(() => resize()).observe(document.getElementById("tankBox"));
  window.addEventListener("beforeunload", save);
  document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

  syncHud();
  setInterval(syncHud, 500);
  setInterval(save, 15000);
  requestAnimationFrame(frame);
})();
</script>
