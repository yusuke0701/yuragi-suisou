<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゆらぎ水槽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">

  <link rel="stylesheet" href="styles.css">

<div class="room" id="room">
  <header class="hud">
    <div class="brand">
      <button class="brand-label brand-btn" id="tankBtn" aria-haspopup="dialog">
        <span id="biomeLabel">熱帯魚</span>
        <svg width="8" height="5" viewBox="0 0 8 5" fill="none" stroke="currentColor"
             stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
          <path d="M1 1l3 3 3-3"></path>
        </svg>
        <span class="care-dot" id="careDot"></span>
      </button>
      <input class="name-input" id="tankName" maxlength="14" aria-label="水槽の名前" spellcheck="false">
    </div>

    <div class="stats">
      <div class="stat" title="コイン">
        <span class="coin-dot"></span>
        <span class="stat-num" id="coins">0</span>
        <span class="stat-sub" id="rate">+0.0/分</span>
      </div>
      <div class="stat is-optional" title="水質">
        <span class="stat-sub">水質</span>
        <span class="gauge" id="waterGauge"><span style="width:100%"></span></span>
      </div>
      <div class="pop-wrap" id="popWrap">
        <button class="stat stat-btn" id="popBtn" title="住人の内訳" aria-haspopup="dialog" aria-expanded="false">
          <span class="stat-sub pop-label">住人</span>
          <span class="stat-num" id="pop">0/16</span>
        </button>
        <div class="roster" id="roster" role="dialog" aria-label="住人の内訳"></div>
      </div>
      <button class="icon-btn" id="menuBtn" aria-label="メニュー">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <circle cx="8" cy="3" r="1.6"></circle><circle cx="8" cy="8" r="1.6"></circle><circle cx="8" cy="13" r="1.6"></circle>
        </svg>
      </button>
    </div>
  </header>

  <div class="stage">
    <div class="tank" id="tankBox">
      <canvas id="tank"></canvas>

      <button class="tank-nav is-prev" id="tankPrev" hidden>
        <svg width="11" height="18" viewBox="0 0 11 18" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 1.5L2 9l6 7.5"></path>
        </svg>
      </button>
      <button class="tank-nav is-next" id="tankNext" hidden>
        <svg width="11" height="18" viewBox="0 0 11 18" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 1.5L9 9l-6 7.5"></path>
        </svg>
      </button>

      <div class="shaker" id="shaker" aria-hidden="true">
        <svg width="68" height="81" viewBox="0 0 52 62" fill="none">
          <defs>
            <linearGradient id="tubeBody" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#c14e26"/>
              <stop offset=".4" stop-color="#ffb083"/>
              <stop offset="1" stop-color="#d9612f"/>
            </linearGradient>
          </defs>

          <g class="tube">
            <rect x="7" y="6" width="25" height="36" rx="6" fill="url(#tubeBody)"
                  stroke="#7d3418" stroke-width="1.1"/>
            <rect x="7.5" y="17" width="24" height="12" fill="#f7e8c8"/>
            <path d="M14.2 23.1c1.7-2.5 5.5-2.5 7.2 0-1.7 2.5-5.5 2.5-7.2 0z" fill="#b4552b"/>
            <path d="M21.6 23.1l3.2-2.3v4.6z" fill="#b4552b"/>
            <circle cx="16.4" cy="22.5" r=".85" fill="#f7e8c8"/>
            <rect x="10" y="1.5" width="19" height="7.5" rx="3" fill="#a8441f"/>
            <rect x="11.6" y="3.2" width="15.8" height="2" rx="1" fill="#cf6b3d"/>
            <rect x="5.5" y="39.5" width="28" height="6.5" rx="3" fill="#b04d26"/>
            <ellipse cx="19.5" cy="46" rx="10" ry="3.4" fill="#2d1c10"/>
            <ellipse cx="19.5" cy="45.2" rx="10" ry="3.4" fill="#e8dcc0" opacity=".22"/>
            <circle cx="16.2" cy="47.6" r="1.7" fill="#e0a94f"/>
            <circle cx="21.4" cy="48.2" r="1.5" fill="#c98f3c"/>
            <circle cx="19" cy="46.6" r="1.3" fill="#eab861"/>
          </g>

          <g class="grains">
            <circle class="grain" cx="17" cy="49" r="1.9" fill="#e0a94f"/>
            <circle class="grain" cx="21" cy="49" r="1.6" fill="#c98f3c"/>
            <circle class="grain" cx="19" cy="50" r="1.7" fill="#eab861"/>
            <circle class="grain" cx="23" cy="50" r="1.4" fill="#d9a04a"/>
          </g>
        </svg>
      </div>

      <div class="hint" id="hint"></div>
    </div>
    <div class="stand"></div>
  </div>

  <nav class="dock">
    <button class="tool is-primary" id="feedBtn">
      <svg width="17" height="17" viewBox="0 0 17 17" fill="currentColor" aria-hidden="true">
        <circle cx="4" cy="5" r="2"></circle><circle cx="11" cy="3.5" r="1.6"></circle>
        <circle cx="8" cy="9.5" r="2.2"></circle><circle cx="13.5" cy="9" r="1.5"></circle>
        <circle cx="5" cy="13" r="1.7"></circle><circle cx="11" cy="14" r="1.3"></circle>
      </svg>
      <span class="tool-label">えさ</span>
    </button>

    <button class="tool" id="shopBtn">
      <svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path d="M3 5.5h11l-1 9H4l-1-9Z" stroke-linejoin="round"></path>
        <path d="M6 5.5V4a2.5 2.5 0 0 1 5 0v1.5" stroke-linecap="round"></path>
      </svg>
      <span class="tool-label">ショップ</span>
    </button>

    <button class="tool is-quiet" id="cleanBtn">
      <svg width="17" height="17" viewBox="0 0 17 17" fill="currentColor" aria-hidden="true">
        <path d="M8.5 1.5l1.1 3.2 3.2 1.1-3.2 1.1-1.1 3.2-1.1-3.2L4.2 5.8l3.2-1.1z"></path>
        <path d="M13 9.5l.65 1.85L15.5 12l-1.85.65L13 14.5l-.65-1.85L10.5 12l1.85-.65z"></path>
      </svg>
      <span class="tool-label">そうじ</span>
    </button>

    <button class="tool is-quiet" id="lightBtn">
      <svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="8.5" cy="8.5" r="3.2"></circle>
        <path d="M8.5 1.4v1.8M8.5 13.8v1.8M1.4 8.5h1.8M13.8 8.5h1.8M3.5 3.5l1.3 1.3M12.2 12.2l1.3 1.3M13.5 3.5l-1.3 1.3M4.8 12.2l-1.3 1.3" stroke-linecap="round"></path>
      </svg>
      <span class="tool-label">あかり</span>
    </button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="shop" aria-label="ショップ">
  <div class="sheet-head">
    <h2 class="sheet-title">ショップ</h2>
    <div class="stat" style="margin-left:auto">
      <span class="coin-dot"></span>
      <span class="stat-num" id="shopCoins">0</span>
    </div>
    <button class="icon-btn" id="shopClose" aria-label="閉じる">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M3.5 3.5l8 8M11.5 3.5l-8 8"></path>
      </svg>
    </button>
  </div>
  <div class="tabs" id="shopTabs">
    <button class="tab is-on" data-tab="fish">さかな</button>
    <button class="tab" data-tab="inv">エビ・貝</button>
    <button class="tab" data-tab="decor">かざり</button>
  </div>
  <div class="goods" id="goods"></div>
</section>

<section class="sheet" id="tanks" aria-label="水槽">
  <div class="sheet-head">
    <h2 class="sheet-title">水槽</h2>
    <div class="stat" style="margin-left:auto">
      <span class="coin-dot"></span>
      <span class="stat-num" id="tanksCoins">0</span>
    </div>
    <button class="icon-btn" id="tanksClose" aria-label="閉じる">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M3.5 3.5l8 8M11.5 3.5l-8 8"></path>
      </svg>
    </button>
  </div>
  <div class="tank-list" id="tankList"></div>
</section>

<section class="sheet" id="dex" aria-label="図鑑">
  <div class="sheet-head">
    <h2 class="sheet-title">図鑑</h2>
    <span class="stat-sub" id="dexCount" style="margin-left:auto"></span>
    <button class="icon-btn" id="dexClose" aria-label="閉じる">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M3.5 3.5l8 8M11.5 3.5l-8 8"></path>
      </svg>
    </button>
  </div>
  <div class="dex-list" id="dexList"></div>
</section>

<section class="sheet" id="menu" aria-label="メニュー">
  <div class="sheet-head">
    <h2 class="sheet-title">メニュー</h2>
    <button class="icon-btn" id="menuClose" aria-label="閉じる" style="margin-left:auto">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M3.5 3.5l8 8M11.5 3.5l-8 8"></path>
      </svg>
    </button>
  </div>
  <div class="menu-list">
    <button class="menu-item" id="dexBtn">図鑑<small>これまでに出会った生きものと、解放の条件</small></button>
    <button class="menu-item" id="howBtn">あそびかた<small>タップでできることの一覧</small></button>
    <button class="menu-item is-warn" id="resetBtn">水槽をリセット<small>住人もかざりも全部いなくなります</small></button>
  </div>
</section>

<section class="card" id="card" aria-label="えらんだもの">
  <div class="card-top">
    <canvas id="cardPreview" width="156" height="116"></canvas>
    <div class="card-body">
      <input class="card-name" id="cardName" maxlength="10" aria-label="なまえ" spellcheck="false">
      <div class="card-meta" id="cardMeta"></div>
      <div class="meter-row" id="cardMeterRow">
        <span>満腹</span>
        <span class="gauge" id="cardGauge"><span style="width:100%"></span></span>
      </div>
      <div class="meter-row" id="cardSizeRow">
        <span>大きさ</span>
        <input type="range" id="cardSize" min="50" max="200" step="5" aria-label="かざりの大きさ">
        <span class="size-val" id="cardSizeVal">&times;1.0</span>
      </div>
    </div>
  </div>
  <div class="card-acts">
    <button class="mini" id="cardClose">とじる</button>
    <button class="mini is-warn" id="cardRelease">にがす</button>
  </div>
</section>

<div class="toasts" id="toasts"></div>

  <script type="module" src="src/main.js"></script>
